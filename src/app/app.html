<button (click)="toggleDarkMode()" class="p-2 rounded bg-gray-100 dark:bg-neutral-800">
  <!-- Icône Lucide Moon ou Sun ici -->
  <svg lucideMoon class="dark:hidden"></svg>
  <svg lucideSun class="hidden dark:block text-yellow-400"></svg>
</button>

<section class="py-16 px-6 max-w-7xl mx-auto">
  <!-- Header de la section -->
  <div class="flex justify-between items-end mb-12">
    <div>
      <h2 class="text-4xl font-black text-main-text mb-2">Biens à la une</h2>
      <p class="text-text-muted font-medium">Découvrez nos meilleures opportunités immobilières.</p>
    </div>
    <button
      class="hidden md:block text-brand font-bold border-b-2 border-brand pb-1 hover:text-brand-hover transition-all"
    >
      Tout explorer
    </button>
  </div>

  <!-- La Grille -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
    @for (item of properties(); track item.id) {
      <app-property-card [property]="item" (toggleFavorite)="handleFavorite($event)"></app-property-card>
    } @empty {
      <div class="col-span-full text-center py-20 bg-gray-50 rounded-3xl">
        <p class="text-gray-400">Aucun bien ne correspond à votre recherche.</p>
      </div>
    }
  </div>
</section>
