<nav
  class="fixed top-0 left-0 right-0 z-50 h-20 bg-white/80 dark:bg-[#121212]/80 backdrop-blur-md border-b border-border/10 px-6 flex items-center transition-all"
>
  <div class="max-w-7xl mx-auto w-full flex justify-between items-center">
    <div class="flex items-center gap-4">
      @if (isDetailsPage()) {
        <button
          (click)="goBack()"
          class="p-2 hover:bg-gray-100 dark:hover:bg-white/10 rounded-full transition-all active:scale-90 flex items-center gap-2 group"
        >
          <svg
            lucideArrowLeft
            class="w-6 h-6 group-hover:-translate-x-1 transition-transform"
          ></svg>
          <span class="font-bold hidden md:block">Retour</span>
        </button>
      } @else {
        <div (click)="goToHome()" class="flex items-center gap-2 cursor-pointer">
          <div class="w-10 h-10 bg-brand rounded-xl flex items-center justify-center text-white">
            <svg lucideHouse class="w-5 h-5"></svg>
          </div>
          <span class="hidden lg:block text-xl font-bold dark:text-white">Immo Starter Pro</span>
        </div>
      }
    </div>

    <div class="flex items-center gap-3">
    @if (isDetailsPage()) {
        <button 
          (click)="scrollToBooking()"
          class="hidden md:flex items-center gap-2 px-6 py-2.5 bg-brand text-white rounded-2xl font-black text-sm shadow-lg shadow-brand/20 hover:scale-105 active:scale-95 transition-all"
        >
          Réserver
          <svg lucideCalendarCheck class="w-4 h-4"></svg>
        </button>
      }
      <div class="w-[1px] h-6 bg-border/10 mx-2 hidden md:block"></div>

      <button
        (click)="toggleDarkMode()"
        class="p-2.5 rounded-full hover:bg-gray-100 dark:hover:bg-white/10 transition-all"
      >
        @if (!isDark()) {
          <svg lucideMoon class="w-5 h-5 text-slate-600"></svg>
        } @else {
          <svg lucideSun class="w-5 h-5 text-yellow-400"></svg>
        }
      </button>
    </div>
  </div>
</nav>
